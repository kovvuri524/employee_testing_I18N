<!DOCTYPE html>
<html lang="en-US">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Employee API Test Report
    </title>

    <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

    <div class="container">

        <h1 id="title">
            Employee API Test Report
        </h1>

        <div class="toolbar">

            <img id="flagIcon" src="../images/us.webp" alt="Flag" width="30" height="20">

            <select id="languageSelect">
            </select>

            <button id="darkModeBtn" onclick="toggleTheme()">

                Dark Mode

            </button>

            <input id="searchInput" type="text" placeholder="Search">

        </div>

        <div class="cards">

            <div class="card">

                <h3 id="totalLabel">
                    Total Tests
                </h3>

                <p>
                    {{ total }}
                </p>

            </div>

            <div class="card">

                <h3 id="passedLabel">
                    Passed
                </h3>

                <p>
                    {{ passed }}
                </p>

            </div>

            <div class="card">

                <h3 id="failedLabel">
                    Failed
                </h3>

                <p>
                    {{ failed }}
                </p>

            </div>

        </div>

        <table id="resultsTable">

            <thead>

                <tr>

                    <th id="testHeader">
                        Test
                    </th>

                    <th id="statusHeader">
                        Status
                    </th>

                </tr>

            </thead>

            <tbody>

                {% for t in tests %}

                <tr>

                    <td>
                        {{ t.nodeid }}
                    </td>

                    <td class="status" data-status="{{ t.outcome }}">
                        {{ t.outcome }}
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

        <p>

            <span id="generatedOnLabel">
                Generated On
            </span>

            : {{ generated_on }}

        </p>

    </div>

    <script src="../js/app.js"></script>

</body>

</html>
